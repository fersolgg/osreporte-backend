<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard OSReporte</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Chart.js CDN para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">OSReporte Dashboard</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="mb-4">Bienvenido al Dashboard</h1>
        <!-- Aquí irán los KPIs, gráficas y tablas -->
        <!-- Layout principal del dashboard OSReporte (maquetación según mockup) -->
        <!-- KPIs principales -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <span class="fw-bold">Abiertos</span>
                    <span id="kpi-open" style="font-size:2rem;">12</span>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <span class="fw-bold">Cerrados</span>
                    <span id="kpi-closed" style="font-size:2rem;">8</span>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <span class="fw-bold">Tiempo Promedio</span>
                    <span id="kpi-avg-time" style="font-size:2rem;">2.5h</span>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <span class="fw-bold">Horas Totales</span>
                    <span id="kpi-total-hours" style="font-size:2rem;">40h</span>
                </div>
            </div>
        </div>
        <!-- Gráfica de tickets por estado -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card p-3">
                    <h5 class="mb-3">Tickets por Estado</h5>
                    <canvas id="chart-tickets-estado" height="120"></canvas>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h5 class="mb-3">Leyenda</h5>
                    <div><span class="legend-dot dot-green"></span>Abierto</div>
                    <div><span class="legend-dot dot-red"></span>Cerrado</div>
                    <div><span class="legend-dot dot-orange"></span>En Progreso</div>
                </div>
            </div>
        </div>
        <!-- Tabla de agentes y desempeño -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card p-3">
                    <h5 class="mb-3">Desempeño de Agentes</h5>
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Agente</th>
                                <th>Tickets Atendidos</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Juan Pérez</td>
                                <td>15</td>
                                <td><span class="badge text-bg-success">Productivo</span></td>
                            </tr>
                            <tr>
                                <td>Ana López</td>
                                <td>10</td>
                                <td><span class="badge text-bg-secondary">Eficiente</span></td>
                            </tr>
                            <tr>
                                <td>Carlos Ruiz</td>
                                <td>5</td>
                                <td><span class="badge text-bg-warning">Casos complejos</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- Botón Exportar (decorativo) -->
        <div class="row mb-4">
            <div class="col-12 text-end">
                <button class="btn btn-outline-secondary disabled">Exportar</button>
            </div>
        </div>
        <!-- Fin del layout principal del dashboard -->
    </div>
    <script src="app.js"></script>
</body>
</html>
